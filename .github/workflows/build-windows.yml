name: Build Windows x64 (Win11 onedir)

# 本 job 持有 contents: write（发布 Release），第三方 action 一律按 commit SHA 固定，
# 避免上游 tag 被移动或重打后，未经审阅的代码拿到本仓库的写权限。
# 形如 `@<40位sha>  # vX` 的写法 Dependabot 仍能识别并自动提 PR 升级，人工只需复核 diff。
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows runner 的控制台默认 cp1252，Python 打印中文会 UnicodeEncodeError 直接把
      # 步骤跑挂（本地 macOS/Linux 全是 UTF-8，复现不出来）。v0.1.4 的构建就栽在这里。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Resolve version tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Generate exe version resource
        # 让 exe 文件属性里能看到版本号，避免多个包只能靠文件名猜
        run: python scripts/make_version_info.py --version ${{ steps.version.outputs.tag }} --out build/version_info.txt

      - name: Build onedir package with PyInstaller
        run: pyinstaller energy-ems.spec --noconfirm --clean

      - name: Assemble release folder (含许可文本与运维脚本)
        shell: pwsh
        run: |
          $dist = "dist/energy_ems"
          Copy-Item -Path build_win11.bat -Destination $dist -Force
          Copy-Item -Path README_DEPLOY.md -Destination $dist -Force
          # MIT 与第三方许可必须随二进制分发：源码仓库里有 LICENSE 不等于 zip 里有
          New-Item -ItemType Directory -Force -Path "$dist/licenses" | Out-Null
          Copy-Item -Path LICENSE, THIRD_PARTY_NOTICES.md -Destination "$dist/licenses" -Force
          # 升级/清理/备份脚本随包，README_DEPLOY 里引用了它们
          New-Item -ItemType Directory -Force -Path "$dist/scripts" | Out-Null
          Copy-Item -Path scripts/backup.py, scripts/recompute.py, scripts/clear_demo.py `
            -Destination "$dist/scripts" -Force
          # 服务化安装脚本随包：README_DEPLOY 第 9 节是生产默认方式，
          # 用户从 zip 解压后必须能直接拿到，不能让人回源码仓库找。
          New-Item -ItemType Directory -Force -Path "$dist/scripts/windows" | Out-Null
          Copy-Item -Path scripts/windows/* -Destination "$dist/scripts/windows" -Force
          $winFiles = @("energy-ems-service.xml", "install-service.bat", "uninstall-service.bat",
                        "install-autostart-task.bat", "uninstall-autostart-task.bat")
          foreach ($f in $winFiles) {
            if (-not (Test-Path "$dist/scripts/windows/$f")) { throw "发布目录缺少 scripts/windows/$f" }
          }
          foreach ($f in @("LICENSE", "THIRD_PARTY_NOTICES.md")) {
            if (-not (Test-Path "$dist/licenses/$f")) { throw "发布目录缺少 licenses/$f" }
          }

      - name: Compress archive and write SHA256
        id: package
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "energy-ems-$tag-win11-x64.zip"
          Compress-Archive -Path "dist/energy_ems/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # 必须写 LF。Windows 上 Set-Content 默认追加 CRLF，`sha256sum -c` 会把行尾的
          # \r 当成文件名的一部分，去找一个叫 "xxx.zip\r" 的文件，报 FAILED open or read
          # ——校验值本身没错，却让人以为包坏了（v0.1.6 的资产就有这个问题）。
          # WriteAllText 不做行尾转换，UTF8Encoding($false) 保证不写 BOM。
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "$zip.sha256"),
            "$hash  $zip`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          # 自检：生成物里不得出现 CR(13)，否则下游 sha256sum -c 一定失败。
          # 别只靠"步骤没报错"判断——写成 CRLF 时 WriteAllText 同样不会报错。
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location) "$zip.sha256"))
          if ($bytes -contains 13) { throw "$zip.sha256 含 CR，必须为纯 LF 行尾" }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$hash" >> $env:GITHUB_OUTPUT

      - name: Verify package contents
        # 发布合规不能只看工作流日志：直接解压清单核对许可文本与关键资源。
        # 注意 PyInstaller 6 起 onedir 布局把数据文件挪进了 _internal/，所以按「路径结尾」
        # 匹配而不是写死根路径——否则换个小版本就要再挂一次构建。
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = "${{ steps.package.outputs.zip }}"
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entries = $archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          } finally {
            $archive.Dispose()
          }
          $required = @(
            '^energy_ems\.exe$',
            # 许可文本必须在我们自己建的顶层 licenses/ 下：依赖自带的
            # _internal/*.dist-info/licenses/LICENSE 不能算数（v0.1.3 包里就是一堆那种，
            # 而真正的 MIT 许可缺失）。
            '^licenses/LICENSE$',
            '^licenses/THIRD_PARTY_NOTICES\.md$',
            '(^|/)schema\.sql$',
            '(^|/)dashboard/index\.html$',
            # 离线 Swagger：纯内网工控机打不开 CDN，资源必须随包
            '(^|/)dashboard/vendor/swagger-ui/swagger-ui-bundle\.js$',
            '(^|/)dashboard/vendor/swagger-ui/swagger-ui\.css$',
            # 服务化脚本：生产部署第一步就要用
            '(^|/)scripts/windows/install-service\.bat$',
            '(^|/)scripts/windows/energy-ems-service\.xml$'
          )
          $missing = @()
          foreach ($pattern in $required) {
            $hit = @($entries | Where-Object { $_ -match $pattern })
            if ($hit.Count -eq 0) { $missing += $pattern }
          }
          if ($missing.Count -gt 0) {
            Write-Host "包内前 15 个条目：" -ForegroundColor Yellow
            $entries | Select-Object -First 15 | ForEach-Object { Write-Host "  $_" }
            throw "发布包缺少：$($missing -join ', ')"
          }
          Write-Host ("包内条目 {0} 个，许可文本与关键资源齐全" -f $entries.Count)

      - name: Smoke test packaged exe
        # 只编译不实跑会放过「双击闪退」：v0.1.1~v0.1.7 的包因为
        # uvicorn.run("main:app") 在冻结环境里找不到 main 模块，启动即退出码 3，
        # 而 CI 一直是绿的。这里把 exe 真拉起来，/healthz 返回 200 才算构建通过。
        shell: pwsh
        run: |
          $exeDir = Join-Path (Get-Location) "dist/energy_ems"
          $exe = Join-Path $exeDir "energy_ems.exe"
          if (-not (Test-Path $exe)) { throw "找不到打包产物 $exe" }
          $port = 18090
          $env:EMS_HOST = "127.0.0.1"
          $env:EMS_PORT = "$port"
          $log = Join-Path (Get-Location) "smoke.log"
          $err = Join-Path (Get-Location) "smoke.err.log"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $exeDir `
                    -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          $url = "http://127.0.0.1:$port/healthz"
          $ok = $false
          $exitCode = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if ($proc.HasExited) { $exitCode = $proc.ExitCode; break }
            try {
              $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          foreach ($f in @($log, $err)) {
            if (Test-Path $f) {
              Write-Host "--- $f ---" -ForegroundColor Yellow
              Get-Content $f | Select-Object -First 30 | ForEach-Object { Write-Host "  $_" }
            }
          }
          if ($ok) {
            Write-Host "exe 启动成功，/healthz 返回 200" -ForegroundColor Green
          } elseif ($null -ne $exitCode) {
            throw "打包后的 exe 启动即退出（退出码 $exitCode），见上方日志"
          } else {
            throw "/healthz 在 30 秒内未返回 200（超时）"
          }

      - name: Generate release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release_notes.py --tag ${{ github.ref_name }} --out release_notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.package.outputs.zip }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish Release (可直链下载)
        # 仅在打 v* tag 时发布，push main 只产出 artifact，不触碰 release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: energy-ems ${{ github.ref_name }} · Win11 x64
          body_path: release_notes.md
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish checksum in job summary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          @"
          ### sha256
          ```
          ${{ steps.package.outputs.sha }}  ${{ steps.package.outputs.zip }}
          ```
          校验：`sha256sum -c ${{ steps.package.outputs.zip }}.sha256`
          （Windows：`certutil -hashfile ${{ steps.package.outputs.zip }} SHA256`）
          "@ >> $env:GITHUB_STEP_SUMMARY
