name: Build Windows x64 (Win11 onedir)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build onedir package with PyInstaller
        run: pyinstaller energy-ems.spec --noconfirm --clean

      - name: Assemble release folder
        shell: pwsh
        run: |
          Copy-Item -Path build_win11.bat -Destination dist/energy_ems/ -Force
          Copy-Item -Path README_DEPLOY.md -Destination dist/energy_ems/ -Force

      - name: Compress archive
        id: package
        shell: pwsh
        run: |
          $stamp = Get-Date -Format yyyyMMdd
          $zip = "energy-ems-win11-x64-$stamp.zip"
          Compress-Archive -Path "dist/energy_ems/*" -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish Release (可直链下载)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: energy-ems Win11 x64
          body: |
            能耗管理系统 energy-ems · Win11 x64 onedir 完整包（MIT 许可）。
            解压后双击 energy_ems.exe，浏览器打开 http://127.0.0.1:8000/ 。
            首次启动为 simulate 模拟数据模式，看板与报表立即可用。
            默认密码 ems2026，首次登录会强制修改，也可用 EMS_PASSWORD 环境变量指定初始密码。
          files: ${{ steps.package.outputs.zip }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
