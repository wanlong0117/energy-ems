name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (static check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint dependencies
        run: python -m pip install ruff==0.17.6

      - name: Run ruff
        run: ruff check .

  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 也跑：README 徽章宣称 Windows/Linux/macOS，开发机是 3.13，
        # 不能让「宣称支持」变成没人验证过的承诺。
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        # 覆盖率门槛那条腿已含全量用例，其余腿不重复跑
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12'
        env:
          PYTHONUTF8: "1"
        shell: bash
        # 同时落一份日志：失败时把尾部写进 Job Summary。否则矩阵里某一条腿红了，
        # 只有仓库管理员能下载日志，维护者只能靠猜是哪条用例挂的。
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-${{ matrix.os }}-${{ matrix.python }}.log

      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          LOG="pytest-${{ matrix.os }}-${{ matrix.python }}.log"
          {
            echo "### pytest 失败尾部（${{ matrix.os }} / py${{ matrix.python }}）"
            echo '```'
            tail -100 "$LOG" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 失败用例同时冒成 annotation：Job Summary 只能在网页看，annotation 可以通过
          # check-runs API 读到，没有管理员权限的维护者也能定位到具体用例。
          grep -E '^(FAILED|ERROR) ' "$LOG" | head -20 | while read -r line; do
            echo "::error title=pytest::${line}"
          done || true

      # 只在一条矩阵腿上跑覆盖率门槛，避免四份重复统计；门槛值见 .coveragerc
      - name: Run tests with coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q --cov=. --cov-report=term

