name: Bug Report / 缺陷报告
description: 报告一个可复现的问题（安装、采集、结算、报表、看板）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把「版本 + 复现步骤 + 期望结果」写全，缺信息的问题通常无法定位。
        安全漏洞请勿在此公开，走 [SECURITY.md](../blob/main/SECURITY.md) 里的私密渠道。
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 看板侧栏或 `energy_ems.exe` 文件属性里的版本号，例如 v0.1.4
      placeholder: v0.1.4
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Windows 发布包（energy-ems-*.zip）
        - 源码运行（python main.py）
        - 其他
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 数据模式
      options:
        - simulate（模拟数据）
        - live（真实采集）
        - 两者都会出现
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净数据库开始的最短路径；涉及配置时请给出 device/point/meter 的关键字段
      placeholder: |
        1. 以 simulate 启动，等基线就绪
        2. 切到 live 并重启
        3. 查看日报 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
      placeholder: 期望日报 is_final=1；实际全部显示未结算，事件日志出现 SETTLE_INCOMPLETE
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 事件日志 / 报错
      description: 看板「事件」页签或 `GET /api/events?limit=50` 的相关记录；请先脱敏 IP 与密码
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirms
    attributes:
      label: 确认
      options:
        - label: 我已搜索过既有 issue，没有重复
          required: true
        - label: 我已移除日志中的真实 IP、密码与现场名称
          required: true
