name: Feature Request / 功能建议
description: 提出一个新功能或改进（请说明现场场景，而不只是功能名）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目的取舍是「单进程 + 单 SQLite + 一个网页」，只做现场真正用得上的 5%。
        描述清场景比描述功能更重要：说清「现在怎么干活、卡在哪」，方案可以一起想。
  - type: textarea
    id: scenario
    attributes:
      label: 现场场景
      description: 谁在什么情况下要用它？现在的做法是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的能力
      description: 一句话说明想要什么；如果有界面/接口草案可以贴出来
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 例如用导出 Excel 现有列自算、走反向代理、用外部脚本
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响某个页面/接口
        - 需要改数据库结构（迁移）
        - 需要改计量/结算口径（影响历史数据）
        - 不确定
    validations:
      required: true
